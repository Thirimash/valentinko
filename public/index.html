<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 Pytanie dla Magico 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #764ba2;
            font-size: 2rem;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .no-btn {
            background: #e0e0e0;
            color: #666;
            position: absolute;
            transition: all 0.15s ease;
        }

        .no-btn:hover {
            background: #d0d0d0;
        }

        .result {
            display: none;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .result h2 {
            color: #f5576c;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .dog {
            font-size: 8rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            animation: float 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .message {
            color: #764ba2;
            font-size: 1.3rem;
            margin-top: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>

    <div class="container">
        <div id="question">
            <h1>💝 Czy Magico będzie moją Walentynką? 💝</h1>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">TAK! 💕</button>
                <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Nie</button>
            </div>
        </div>

        <div class="result" id="result">
            <h2>🎉 HURRA! 🎉</h2>
            <div class="dog">🐶</div>
            <p class="message">Jesteś moją Walentynką! 💖</p>
        </div>
    </div>

    <script>
        let moveCount = 0;

        function moveButton() {
            const btn = document.getElementById('noBtn');
            const container = document.querySelector('.buttons');
            const containerRect = container.getBoundingClientRect();

            moveCount++;

            // Im więcej razy próbuje kliknąć, tym bardziej przycisk ucieka
            const maxMove = 150 + (moveCount * 20);
            const randomX = (Math.random() - 0.5) * maxMove;
            const randomY = (Math.random() - 0.5) * maxMove;

            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;

            // Czasami zmień tekst na przycisk żeby było śmieszniej
            const messages = ['Nie', 'Nieee', 'Zastanów się!', 'Serio?', 'Kliknij TAK!', 'Nie uciekaj!'];
            btn.textContent = messages[Math.min(moveCount, messages.length - 1)];
        }

        function handleYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            createHearts();

            // Efekt dźwiękowy (vibration na mobile)
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');

            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = Math.random() > 0.5 ? '💖' : '💕';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.animationDelay = Math.random() + 's';

                heartsContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }

        // Dodaj trochę interaktywności - niech przycisk "nie" już od razu się trochę rusza
        window.addEventListener('load', () => {
            const noBtn = document.getElementById('noBtn');
            setInterval(() => {
                if (moveCount === 0) {
                    const wiggle = Math.sin(Date.now() / 200) * 2;
                    noBtn.style.transform = `translateX(${wiggle}px)`;
                }
            }, 50);
        });
    </script>
</body>
</html>
